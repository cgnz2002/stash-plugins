name: Fan Site Metadata Sync (OnlyFans + JustFor.Fans + Patreon)
description: Sync scraped metadata (title, details, date, post URL, performers, studio, tags) from OF-Scraper and jff-scraper user_data.db files, and from patreon-dl's on-disk post files, into matching Stash scenes and images, group each post's media into a gallery, and adopt the galleries Stash makes from scanned image folders. Each database's site is detected from the database itself.
version: 2.13.0
url: https://github.com/cgnz2002/stash-plugins

settings:
  dataPath:
    displayName: OnlyFans Data Path
    description: "Directory (as seen inside the Stash container) searched recursively for OF-Scraper user_data.db files. Leave blank if you have no OnlyFans library. Example: /data/only fans"
    type: STRING
  parentStudioName:
    displayName: OnlyFans Parent Studio
    description: "Name of the top-level OnlyFans studio. Per-creator studios are created beneath it. Created automatically if it doesn't exist. Default: OnlyFans (network)"
    type: STRING
  jffDataPath:
    displayName: JustFor.Fans Data Path
    description: "Directory (as seen inside the Stash container) searched recursively for jff-scraper user_data.db files. Leave blank if you have no JustFor.Fans library. Example: /data/justforfans"
    type: STRING
  jffParentStudioName:
    displayName: JustFor.Fans Parent Studio
    description: "Name of the top-level JustFor.Fans studio. Per-creator studios are created beneath it. Created automatically if it doesn't exist. Default: JustForFans (network)"
    type: STRING
  patreonDataPath:
    displayName: Patreon Data Path
    description: "Directory (as seen inside the Stash container, e.g. /data/patreon - NOT the NAS path) that patreon-dl downloads into. Each '<vanity> - <Creator Name>' folder beneath it is one creator. Leave blank if you have no Patreon library. Unlike the other sites there is no database: the post metadata is read from each post's post_info files."
    type: STRING
  patreonParentStudioName:
    displayName: Patreon Parent Studio
    description: "Name of the top-level Patreon studio. Per-creator studios are created beneath it. Created automatically if it doesn't exist. Default: Patreon (network)"
    type: STRING
  maxTitleLength:
    displayName: Max Title Length
    description: "Maximum length of a generated title before it is truncated at a sentence or word boundary. Default: 65"
    type: NUMBER
  multiplePerformersOk:
    displayName: Allow Multiple Performer Matches
    description: "If several performers match a username, attach all of them. Default off: the creator is skipped when the match is ambiguous."
    type: BOOLEAN
  autoCreatePerformers:
    displayName: Create Missing Performers
    description: "When on, create a sparse performer for the creator (and any unmatched collaborators in the post text, whether @mentioned or linked by profile URL) instead of skipping. Default off."
    type: BOOLEAN
  keepManualEdits:
    displayName: Keep Manual Performers & Tags
    description: "When on, sync is non-destructive to performers and tags: it MERGES them instead of replacing, so anything you added by hand stays, while the post's creator/@mentions and tags are added alongside. Everything else (title, details, date, studio, URL) is still updated. Crew-tagged people are still moved out of the performers list on scenes/images. Turn this on so a Full Sync (or the per-performer button) doesn't wipe manual performers/tags. Default off (a full sync replaces the performer and tag lists)."
    type: BOOLEAN
  autoTagFromText:
    displayName: Auto-tag From Post Text
    description: "When on, scan each post's text and attach any existing Stash tags whose name or alias appears in it (matched the same way as Stash's auto-tagger). Only tags are added, never created. Tags set to ignore auto-tag are skipped. Default off."
    type: BOOLEAN
  skipMultiFile:
    displayName: Skip Multi-file Scenes and Images
    description: "When on, the Sync and Full Sync tasks skip any scene or image that has more than one file (typically merged scenes from multiple OF pages), to avoid overwriting their performers and metadata. Does not affect the Tag task. DOES NOT APPLY TO PATREON: there a multi-file item is a byte-identical duplicate -- a creator who posts the same image at several tiers downloads an identical copy into each post folder and Stash merges them on hash -- so skipping them would skip ordinary images whose only sin is being posted twice. Patreon media is always synced, and takes the metadata of the lowest-sorting post folder it appears in. Default off."
    type: BOOLEAN
  syncWorkers:
    displayName: Sync Workers
    description: "How many scene/image/gallery writes to send to Stash at once. Stash is SQLite-backed and SQLite has a SINGLE writer, so parallel writes don't truly commit in parallel -- they queue on the DB write lock. A little concurrency hides latency; too much just piles up transactions until they time out and starves the rest of Stash. Writes are retried automatically on transient 'database is locked' / 'FOREIGN KEY constraint' / 'timed out' contention. If you see those errors on big Full Syncs, LOWER this (1 = original one-at-a-time behaviour, the safest). Range 1-16. Default 2."
    type: NUMBER
  titleExclusions:
    displayName: Title Exclusions
    description: "Phrases or regular expressions to strip from generated scene/image/gallery TITLES. The details/description field is left untouched (it keeps the original post text). Each entry is matched case-insensitively anywhere in the title and removed, then leftover separators are tidied -- e.g. an entry 'new collab:' turns the title 'New collab: Beach day' into 'Beach day' while the description stays as written. Best edited with the list editor: Settings > Tools > 'Fan Site Sync: Title Exclusions' (add/remove rows, then Save). This field is a fallback -- you can also type one pattern here or paste a JSON array."
    type: STRING
  dryRun:
    displayName: Dry Run
    description: "When on, every task logs the changes it would make - each scene/image/gallery it would update, each studio/performer/tag/gallery it would create - without writing anything to Stash. Reads still happen, so the preview reflects your real library. The 'Preview (Dry Run)' task forces this on for a single run regardless of this setting. Default off."
    type: BOOLEAN
  crewTagId:
    displayName: Crew Tag ID
    description: "The Stash tag ID that marks crew performers (directors/photographers). Find it in the tag's page URL, e.g. .../tags/42 means the ID is 42. Any performer with this tag -- the creator or a collaborator credited by @mention or profile URL (onlyfans.com/username or justfor.fans/username) -- is credited in each scene's Director field and each image's Photographer field instead of the performers list; the studio still follows the media's source, and if a post's only credits are crew the creator is added as a performer so nothing is left empty. Leave empty to disable crew handling."
    type: STRING
  sponsorTagId:
    displayName: Sponsor Tag ID
    description: "The Stash tag ID that marks SPONSOR performers (brands/advertisers). Find it in the tag's page URL, e.g. .../tags/42 means the ID is 42. Any performer with this tag -- the creator or a collaborator credited by @mention or profile URL -- is REMOVED from the performers list and the scene/image/gallery is tagged 'sponsored' instead, since Stash has no field to credit a sponsor in. Unlike crew, sponsors are dropped from galleries too. The 'sponsored' tag is created if missing (an existing tag with that name or alias is reused) and is only ever added, never removed. If a post's only credits are sponsors the creator is kept as a performer so nothing is left empty. Leave empty to disable sponsor handling."
    type: STRING

exec:
  - python
  - "{pluginDir}/sync.py"
interface: raw
errLog: error

ui:
  javascript:
    - performerSync.js
    - titleExclusions.js

tasks:
  - name: Sync Metadata
    description: Sync metadata to unorganized scenes and images across every configured site, group each post's media into a gallery, and adopt Stash's scanned-folder galleries.
    defaultArgs:
      mode: sync
  - name: Full Sync Metadata
    description: Re-sync ALL scenes and images across every configured site (ignoring the organized flag) and refresh the galleries.
    defaultArgs:
      mode: full
  - name: Tag From Text
    description: Add tags (each site's tag, the post's hashtags, paid/pinned, plus any matched from post text) to ALL synced scenes, images and galleries. Only adds tags, leaves every other field untouched. Safe for manually edited scenes.
    defaultArgs:
      mode: tag
  - name: Update Crew & Sponsors
    description: Re-apply only the crew and sponsor logic to ALL synced scenes and images - move director/photographer-tagged people into the director/photographer field, and drop sponsor-tagged accounts from the performers list in favour of a 'sponsored' tag. Leaves titles, dates, studios and everything else untouched (the only tag change is adding 'sponsored'). Use after tagging new performers as crew or sponsors, to avoid a full re-sync.
    defaultArgs:
      mode: crew
  - name: Sync OnlyFans Only
    description: Same as Sync Metadata, but only scans the OnlyFans data path - faster when you just added OnlyFans content and don't want the other sites walked. Databases under that path that identify as another site are skipped.
    defaultArgs:
      mode: sync
      site: onlyfans
  - name: Sync JustFor.Fans Only
    description: Same as Sync Metadata, but only scans the JustFor.Fans data path - faster when you just added JustFor.Fans content and don't want the other sites walked. Databases under that path that identify as another site are skipped.
    defaultArgs:
      mode: sync
      site: justforfans
  - name: Sync Patreon Only
    description: Same as Sync Metadata, but only scans the Patreon data path - faster when you just added Patreon content and don't want the other sites walked.
    defaultArgs:
      mode: sync
      site: patreon
  - name: Full Sync OnlyFans Only
    description: A FULL re-sync (ignoring the organized flag) scoped to the OnlyFans data path only. Use this to re-process one site's whole library without walking the others.
    defaultArgs:
      mode: full
      site: onlyfans
  - name: Full Sync JustFor.Fans Only
    description: A FULL re-sync (ignoring the organized flag) scoped to the JustFor.Fans data path only. Use this to re-process one site's whole library without walking the others.
    defaultArgs:
      mode: full
      site: justforfans
  - name: Full Sync Patreon Only
    description: A FULL re-sync (ignoring the organized flag) scoped to the Patreon data path only. Use this to re-process Patreon without walking the other sites - and to pick up media an older Patreon plugin already marked organized.
    defaultArgs:
      mode: full
      site: patreon
  - name: Preview (Dry Run)
    description: Preview a FULL sync in the log without writing anything to Stash - every scene, image and gallery it would update, and every studio, performer, tag and gallery it would create. Safe to run first, and the sensible thing to do before a site's first sync.
    defaultArgs:
      mode: full
      dryRun: true
  - name: Preview OnlyFans (Dry Run)
    description: Preview a full OnlyFans sync in the log without writing anything to Stash. Scoped to the OnlyFans data path, so the other sites aren't walked.
    defaultArgs:
      mode: full
      site: onlyfans
      dryRun: true
  - name: Preview JustFor.Fans (Dry Run)
    description: Preview a full JustFor.Fans sync in the log without writing anything to Stash. Scoped to the JustFor.Fans data path, so the other sites aren't walked.
    defaultArgs:
      mode: full
      site: justforfans
      dryRun: true
  - name: Preview Patreon (Dry Run)
    description: Preview a full Patreon sync in the log without writing anything to Stash. Scoped to the Patreon data path, so the other sites aren't walked. The sensible first run on a new Patreon library.
    defaultArgs:
      mode: full
      site: patreon
      dryRun: true
  - name: Preview Cleanup of Stray Media (Dry Run)
    description: "SAFE, WRITES NOTHING. Lists every scene and image that carries one of this plugin's studios but sits OUTSIDE every configured data path - media an older version reached by mistake, because Stash's path filter matches a creator's name anywhere in your library (e.g. a creator called 'Mirenac' matched /torrents/downloads/whisparr/[Mirenac] .../1.png). Run this FIRST and read the log."
    defaultArgs:
      mode: cleanup
      dryRun: true
  - name: Clean Up Stray Media
    description: "Undoes what an older version wrote onto media outside your data paths: clears the title, details, date, code, studio, this plugin's tags, the post URL and the creator performer, and sets organized back to false so the media returns to whatever 'not yet sorted' workflow it came from. Only ever touches media that is OUTSIDE every configured data path AND still carries a post URL this plugin wrote. Media you organised yourself is never touched, even when you filed it under the same parent studio - a studio under that parent is not evidence the plugin wrote anything, since torrented fan-site content is reasonably filed there too. Anything carrying a stash-box ID (FansDB, StashDB) is also left alone: a scrape writes the same kind of post URL and studio name this plugin does, so the ID is the only thing that tells them apart. The originals cannot be restored, so preview first."
    defaultArgs:
      mode: cleanup
  - name: Sync Performer
    description: Full re-sync of a SINGLE performer, across every configured site. Triggered by the "Sync Fan Sites" button on a performer's page (it passes the performer id); running it here without one does nothing.
    defaultArgs:
      mode: performer
