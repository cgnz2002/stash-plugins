name: DEPRECATED - Patreon Metadata Sync
description: "DEPRECATED - DO NOT INSTALL. Patreon is now synced by Fan Site Metadata Sync (of-stash-sync) alongside OnlyFans and JustFor.Fans, which is actively maintained and has since gained fixes this plugin does not have. Set its Patreon Data Path and use its Sync Patreon Only / Full Sync Patreon Only tasks instead. Don't run both plugins over the same library. This one remains only so existing installs keep working, and will be removed."
version: 3.3.0
url: https://github.com/cgnz2002/stash-plugins

settings:
  dataPath:
    displayName: Patreon Data Path
    description: "Directory (as seen inside the Stash container) that patreon-dl downloads into, searched recursively for post folders. Example: /data/patreon"
    type: STRING
  parentStudioName:
    displayName: Parent Studio Name
    description: "Name of the top-level Patreon studio. Per-creator studios are created beneath it, and it is created automatically if it doesn't exist. Default: Patreon (network)"
    type: STRING
  autoTagFromText:
    displayName: Auto-tag From Post Text
    description: "When on, scan each post's title/description and attach any existing Stash tags whose name or alias appears in it (matched the same way as Stash's auto-tagger). Only tags are added, never created. Tags set to ignore auto-tag are skipped. Default off."
    type: BOOLEAN
  syncCollections:
    displayName: Sync Collections
    description: "When on, the Sync and Full Sync tasks create a Stash gallery for each Patreon collection and attach the member posts' images to it. Default on."
    type: BOOLEAN
  dryRun:
    displayName: Dry Run
    description: "When on, every task previews its changes in the log (each gallery/image it would update, each studio/performer/collection gallery it would create) without writing anything to Stash. The 'Preview (Dry Run)' task forces this on for a single run regardless of this setting. Default off."
    type: BOOLEAN

exec:
  - python
  - "{pluginDir}/sync.py"
interface: raw
errLog: error

tasks:
  - name: Sync Patreon Metadata
    description: DEPRECATED - use 'Sync Patreon Only' in Fan Site Metadata Sync instead. Syncs metadata onto unorganized Patreon galleries and images, and builds collection galleries.
    defaultArgs:
      mode: sync
  - name: Full Sync Patreon Metadata
    description: DEPRECATED - use 'Full Sync Patreon Only' in Fan Site Metadata Sync instead. Re-syncs ALL Patreon galleries and images (ignoring the organized flag) and rebuilds collection galleries.
    defaultArgs:
      mode: full
  - name: Tag Patreon From Text
    description: DEPRECATED - use 'Tag From Text' in Fan Site Metadata Sync instead. Adds tags from post text to ALL Patreon galleries and images, leaving every other field untouched.
    defaultArgs:
      mode: tag
  - name: Preview (Dry Run)
    description: DEPRECATED - use 'Preview Patreon (Dry Run)' in Fan Site Metadata Sync instead. Previews a full sync in the log without writing anything to Stash.
    defaultArgs:
      mode: full
      dryRun: true
