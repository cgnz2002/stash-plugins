name: JustFor.Fans Metadata Sync
description: Sync jff-scraper metadata (title, details, date, real post URL, performers, studio, hashtags) from user_data.db files into matching Stash scenes and images, and group each post's media into a gallery (linked to the post's scene).
version: 1.0.1
url: https://github.com/cgnz2002/stash-plugins

settings:
  dataPath:
    displayName: JFF Data Path
    description: "Directory (as seen inside the Stash container) searched recursively for jff-scraper user_data.db files. Example: /data/justforfans"
    type: STRING
  parentStudioName:
    displayName: Parent Studio Name
    description: "Name of the top-level JustFor.Fans studio. Per-creator studios are created beneath it. Default: JustForFans (network)"
    type: STRING
  maxTitleLength:
    displayName: Max Title Length
    description: "Maximum length of a generated title before it is truncated at a sentence or word boundary. Default: 65"
    type: NUMBER
  multiplePerformersOk:
    displayName: Allow Multiple Performer Matches
    description: "If several performers match a username, attach all of them. Default off: the creator is skipped when the match is ambiguous."
    type: BOOLEAN
  autoCreatePerformers:
    displayName: Create Missing Performers
    description: "When on, create a sparse performer for the creator (and any unmatched collaborators in the post text, whether @mentioned or linked by a justfor.fans profile URL) instead of skipping. Default off."
    type: BOOLEAN
  keepManualEdits:
    displayName: Keep Manual Performers & Tags
    description: "When on, sync is non-destructive to performers and tags: it MERGES them instead of replacing, so anything you added by hand stays, while the post's creator/collaborators and tags are added alongside. Everything else (title, details, date, studio, URL) is still updated. Crew-tagged people are still moved out of the performers list on scenes/images. Turn this on so a Full Sync (or the per-performer button) doesn't wipe manual performers/tags. Default off (a full sync replaces the performer and tag lists)."
    type: BOOLEAN
  autoTagFromText:
    displayName: Auto-tag From Post Text
    description: "When on, scan each post's text and attach any existing Stash tags whose name or alias appears in it (matched the same way as Stash's auto-tagger). Only existing tags are added, never created. Tags set to ignore auto-tag are skipped. This is separate from the post's own JustFor.Fans hashtags, which are always synced. Default off."
    type: BOOLEAN
  skipMultiFile:
    displayName: Skip Multi-file Scenes and Images
    description: "When on, the Sync and Full Sync tasks skip any scene or image that has more than one file (typically merged scenes), to avoid overwriting their performers and metadata. Does not affect the Tag task. Default off."
    type: BOOLEAN
  syncWorkers:
    displayName: Sync Workers
    description: "How many scene/image/gallery writes to send to Stash at once. Stash is SQLite-backed and SQLite has a SINGLE writer, so parallel writes don't truly commit in parallel -- they queue on the DB write lock. A little concurrency hides latency; too much just piles up transactions until they time out and starves the rest of Stash. Writes are retried automatically on transient 'database is locked' / 'FOREIGN KEY constraint' / 'timed out' contention. If you see those errors on big Full Syncs, LOWER this (1 = one-at-a-time, the safest). Range 1-16. Default 2."
    type: NUMBER
  titleExclusions:
    displayName: Title Exclusions
    description: "Phrases or regular expressions to strip from generated scene/image/gallery TITLES. The details/description field is left untouched (it keeps the original post text). Each entry is matched case-insensitively anywhere in the title and removed, then leftover separators are tidied -- e.g. an entry 'new collab:' turns the title 'New collab: Beach day' into 'Beach day' while the description stays as written. Best edited with the list editor: Settings > Tools > 'JustFor.Fans Sync: Title Exclusions' (add/remove rows, then Save). This field is a fallback -- you can also type one pattern here or paste a JSON array."
    type: STRING
  crewTagId:
    displayName: Crew Tag ID
    description: "The Stash tag ID that marks crew performers (directors/photographers). Find it in the tag's page URL, e.g. .../tags/42 means the ID is 42. Any performer with this tag -- the creator or a collaborator credited by @mention or profile URL (justfor.fans/username) -- is credited in each scene's Director field and each image's Photographer field instead of the performers list; the studio still follows the media's source, and if a post's only credits are crew the creator is added as a performer so nothing is left empty. Leave empty to disable crew handling."
    type: STRING

exec:
  - python
  - "{pluginDir}/sync.py"
interface: raw
errLog: error

ui:
  javascript:
    - performerSync.js
    - titleExclusions.js

tasks:
  - name: Sync JFF Metadata
    description: Sync metadata to unorganized JustFor.Fans scenes and images, and group each post's media into a gallery (linked to the post's scene).
    defaultArgs:
      mode: sync
  - name: Full Sync JFF Metadata
    description: Re-sync ALL JustFor.Fans scenes and images (ignoring the organized flag) and refresh the per-post galleries.
    defaultArgs:
      mode: full
  - name: Tag JFF From Text
    description: Add tags (the JustFor.Fans tag, the post's hashtags, paid/pinned, plus any matched from post text) to ALL JustFor.Fans scenes, images and galleries. Only adds tags, leaves every other field untouched. Safe for manually edited scenes.
    defaultArgs:
      mode: tag
  - name: Update Crew
    description: Re-apply only the crew logic to ALL JustFor.Fans scenes and images - move director/photographer-tagged people into the director/photographer field and out of the performers list. Leaves titles, dates, studios, tags and everything else untouched. Use after tagging new performers as crew, to avoid a full re-sync.
    defaultArgs:
      mode: crew
  - name: Sync Performer
    description: Full re-sync of a SINGLE JustFor.Fans performer. Triggered by the "Sync JustFor.Fans" button on a performer's page (it passes the performer id); running it here without one does nothing.
    defaultArgs:
      mode: performer
